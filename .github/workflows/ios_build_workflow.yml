name: Build iOS IPA

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Xcode 版本
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: 安装依赖（如果需要）
      run: |
        cd integrations/jev_ios
        # 如果使用 CocoaPods
        if [ -f "Podfile" ]; then
          pod install
        fi
        # 如果使用 Swift Package Manager，Xcode 会自动处理

    - name: 创建 ExportOptions.plist
      run: |
        cat > integrations/jev_ios/ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>development</string>
          <key>compileBitcode</key>
          <false/>
          <key>signingStyle</key>
          <string>manual</string>
        </dict>
        </plist>
        EOF

    - name: 构建 IPA（无签名）
      run: |
        cd integrations/jev_ios

        # 查找 workspace 或 project 文件
        WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
        PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)

        if [ -n "$WORKSPACE" ]; then
          echo "使用 workspace: $WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "GoutouJunshi" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
        elif [ -n "$PROJECT" ]; then
          echo "使用 project: $PROJECT"
          xcodebuild -project "$PROJECT" \
            -scheme "GoutouJunshi" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive
        else
          echo "错误：找不到 .xcworkspace 或 .xcodeproj 文件"
          exit 1
        fi

        # 导出为 IPA
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist

    - name: 上传 IPA 文件
      uses: actions/upload-artifact@v4
      with:
        name: jev-ios-app
        path: integrations/jev_ios/build/*.ipa
        retention-days: 30
