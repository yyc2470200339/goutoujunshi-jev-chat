workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      vars:
        XCODE_WORKSPACE: "integrations/jev_ios/GoutouJunshi.xcodeproj"
        XCODE_SCHEME: "GoutouJunshi"
        BUNDLE_ID: "ai.goutoujunshi.chatios"
        APP_GROUP: "group.ai.goutoujunshi.chatios"
      
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          # 进入 iOS 项目目录
          cd integrations/jev_ios
          
          # 创建本地签名配置（如果需要）
          if [ -n "$DEVELOPMENT_TEAM" ]; then
            cat > Signing.local.xcconfig << EOF
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          GOUTOU_BUNDLE_ID = $BUNDLE_ID
          GOUTOU_APP_GROUP = $APP_GROUP
          EOF
          fi
      
      - name: Install dependencies (if any)
        script: |
          cd integrations/jev_ios
          # 如果有 CocoaPods
          if [ -f "Podfile" ]; then
            pod install
          fi
      
      - name: Build ipa for distribution
        script: |
          cd integrations/jev_ios
          
          # 使用 Xcode 构建（无签名）
          xcodebuild archive \
            -project GoutouJunshi.xcodeproj \
            -scheme GoutouJunshi \
            -configuration Release \
            -derivedDataPath build/derived \
            -archivePath build/GoutouJunshi.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO || true
          
          # 创建临时导出配置（无签名）
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>method</key>
              <string>ad-hoc</string>
          </dict>
          </plist>
          EOF
          
          # 导出 IPA
          xcodebuild -exportArchive \
            -archivePath build/GoutouJunshi.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates || true
    
    artifacts:
      - integrations/jev_ios/build/output/*.ipa
    
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
