workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    
    environment:
      vars:
        XCODE_WORKSPACE: "integrations/jev_ios/GoutouJunshi.xcodeproj"
        XCODE_SCHEME: "GoutouJunshi"
        BUNDLE_ID: "ai.goutoujunshi.chatios"
        APP_GROUP: "group.ai.goutoujunshi.chatios"
      
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install dependencies
        script: |
          cd integrations/jev_ios
          if [ -f "Podfile" ]; then
            pod install
          fi
      
      - name: Build IPA
        script: |
          cd integrations/jev_ios
          
          echo "🔨 Building for simulator (no signing required)..."
          
          # 直接构建 App Bundle（不需要签名）
          xcodebuild build \
            -project GoutouJunshi.xcodeproj \
            -scheme GoutouJunshi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO
          
          echo "✓ Build completed"
          
          # 查找生成的 .app 文件
          APP_PATH=$(find build/derived -name "GoutouJunshi.app" -path "*/Release-iphoneos/*" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ App not found!"
            find build/derived -name "*.app"
            exit 1
          fi
          
          echo "✓ Found app at: $APP_PATH"
          
          # 创建 Payload 目录结构
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/
          
          # 打包为 IPA
          cd build/output
          zip -r GoutouJunshi.ipa Payload
          rm -rf Payload
          
          echo "✓ IPA created: $(ls -lh GoutouJunshi.ipa)"
          
          # 验证 IPA
          if [ -f "GoutouJunshi.ipa" ]; then
            echo "✅ IPA file ready for download"
            unzip -l GoutouJunshi.ipa | head -20
          else
            echo "❌ IPA creation failed!"
            exit 1
          fi
    
    artifacts:
      - integrations/jev_ios/build/output/*.ipa
    
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
